; Application PHP settings.
;
; display_errors is Off unconditionally: PHP itself must never write a trace, path or SQL
; fragment into an HTTP response (FR-010). Developer-facing detail in APP_ENV=dev is
; produced by Yii's own error handler, which is controlled by the application, not here.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

memory_limit = 256M
max_execution_time = 30
post_max_size = 2M
upload_max_filesize = 2M

; Correct character semantics for the 1-255 Unicode name rule (FR-003).
; default_charset drives mbstring's internal encoding; the separate
; mbstring.internal_encoding directive is deprecated and must not be set.
default_charset = "UTF-8"

date.timezone = UTC

; Sessions are not used (the application is unauthenticated) but harden the defaults anyway.
session.cookie_httponly = On
session.cookie_samesite = "Lax"
session.use_strict_mode = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
