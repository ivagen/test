[www]
; The php-fpm master runs as root only so it can create the socket and drop privileges;
; every request is executed by the unprivileged www-data user below.
user = www-data
group = www-data

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; REQUIRED: without this php-fpm wipes the environment and the application cannot read its
; Docker-provided configuration (database credentials, APP_ENV, ...) via getenv().
clear_env = no

; Structured, container-friendly logging: everything goes to the container's stderr/stdout
; so `docker compose logs app` is the single place to look.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/1
access.format = "%R \"%m %r%Q%q\" %s %{mili}dms %{kilo}Mkb"
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
