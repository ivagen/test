# Reverse proxy: the single host-facing entrypoint (SC-006).
#
# It terminates browser traffic, serves static assets, forwards PHP to php-fpm and upgrades
# /ws to the real-time worker on the SAME ORIGIN -- which is what makes `wss` work behind
# TLS with no mixed content (spec US3 scenario 4). The legacy setup instead exposed a raw
# WebSocket on host port 8047, a second origin that could never be secured.

# Maps the hop-by-hop Connection header: "upgrade" for a WebSocket handshake, empty (so the
# header is dropped) for ordinary requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream php-app {
    server app:9000;
}

upstream realtime {
    server websocket:8080;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /var/www/web;
    index index.php;

    charset       utf-8;
    server_tokens off;

    client_max_body_size 2m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- security headers ---------------------------------------------------------------
    # The client is a bundled same-origin script with no inline <script>: the CSRF token is
    # delivered through a <meta> tag, so 'unsafe-inline' is never needed.
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "no-referrer"        always;
    add_header Permissions-Policy     "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- nginx's own liveness (does NOT depend on php-fpm) -------------------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- real-time ----------------------------------------------------------------------
    location = /ws {
        proxy_pass         http://realtime;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than the client heartbeat so an idle but healthy socket is not culled.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;
    }

    # --- static assets ------------------------------------------------------------------
    # Vite emits content-hashed filenames, so these are safe to cache immutably.
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; allow all; try_files $uri =404; }

    # --- application --------------------------------------------------------------------
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the single front controller may execute. Anything else ending in .php is denied,
    # which closes the arbitrary-PHP-execution hole the legacy `location ~ \.php$` left open.
    location = /index.php {
        # The front controller is reachable only through the internal try_files rewrite
        # above. A client that asks for /index.php directly is redirected to the clean URL,
        # which removes the second entry point that made the legacy `?r=site/...` query
        # routing addressable at all. Internal rewrites keep their original $request_uri,
        # so they never match this condition. (`return` inside `if` is one of the two
        # constructs nginx documents as safe here.)
        if ($request_uri ~ ^/index\.php) {
            return 301 /;
        }

        fastcgi_pass  php-app;
        fastcgi_index index.php;
        include       fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
        fastcgi_param HTTPS           $https if_not_empty;

        fastcgi_read_timeout 60s;
        fastcgi_hide_header  X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    # Never serve VCS metadata, dotfiles, or anything that leaked outside web/.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
